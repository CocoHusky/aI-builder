<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fusion AI Assistant</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #0f172a;
        --panel: #111827;
        --text: #e5e7eb;
        --muted: #94a3b8;
        --accent: #22c55e;
        --border: #334155;
      }
      body {
        margin: 0;
        background: linear-gradient(180deg, var(--bg), #020617);
        color: var(--text);
        font-family: Arial, sans-serif;
      }
      .wrap {
        padding: 16px;
      }
      textarea,
      input,
      button {
        width: 100%;
        box-sizing: border-box;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--text);
        margin: 6px 0 12px;
        padding: 10px;
      }
      button {
        background: var(--accent);
        color: #052e16;
        font-weight: 700;
        cursor: pointer;
      }
      .hint {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.4;
      }
      pre {
        white-space: pre-wrap;
        background: rgba(15, 23, 42, 0.8);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Fusion AI Assistant</h1>
      <p class="hint">Describe the CAD change. The backend should convert it into a structured command plan before any model edit runs.</p>
      <textarea id="prompt" rows="6" placeholder="Create a wearable enclosure with rounded corners and a battery pocket..."></textarea>
      <input id="checkpoint" placeholder="Optional checkpoint name" />
      <button id="run">Preview Commands</button>
      <pre id="output">Waiting for input.</pre>
    </div>
    <script>
      document.getElementById("run").addEventListener("click", () => {
        const prompt = document.getElementById("prompt").value.trim();
        const checkpoint = document.getElementById("checkpoint").value.trim();
        document.getElementById("output").textContent = JSON.stringify(
          { prompt, checkpoint, status: "ready_for_backend" },
          null,
          2
        );
      });
    </script>
  </body>
</html>
