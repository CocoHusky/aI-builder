[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fusion-ai-assistant"
version = "0.1.0"
description = "OpenAI-assisted Autodesk Fusion add-in scaffold"
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
include = ["fusion_ai_assistant*"]
